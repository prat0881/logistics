# Production compose — the LIVE deployment. CI/CD (.github/workflows/deploy.yml) deploys this
# file and the droplet at /opt/svyft-logistics runs it. Serves the API + built SPA over plain
# HTTP on :4096 (no TLS yet — no domain). For the HTTPS/Caddy edge, see docker-compose.caddy.yml.
# `IMAGE` is injected by the deploy job (pinned to the built git SHA); it defaults to :latest.
services:
  api:
    image: ${IMAGE:-ghcr.io/sj132q/svyft-logistics:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SERVE_STATIC: "true"
      PORT: "4000"
      UPLOADS_DIR: /uploads
    ports: ["4096:4000"]
    volumes:
      - uploads:/uploads
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  uploads:
