name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: svyft
          POSTGRES_PASSWORD: svyft
          POSTGRES_DB: svyft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U svyft"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # `connection_limit=10` is load-bearing on a hosted runner, not tuning. Without it Prisma
      # derives the pool from CPU count and the runner computed 3 — while
      # `quotation.e2e-spec.ts`'s C10 race test needs FOUR simultaneous connections at once: the
      # `SELECT … FOR UPDATE` holding the row lock, the in-flight `issue` request, the `PATCH`
      # sitting blocked on its UPDATE, and the poller reading `pg_stat_activity` to prove the PATCH
      # really is blocked. The suite boots the whole AppModule, so app and test share one pool and
      # all four contend. The poller then cannot get a connection, times out after 10s, and the
      # test fails DETERMINISTICALLY on CI while passing locally (a dev machine's pool is ~21).
      # In practice this is INTERMITTENT, not always-red: `ubuntu-latest` does not always allocate
      # the same core count, so some runs computed a pool of 5 and passed. The run history shows
      # exactly that — two consecutive `pull_request` failures on 2026-08-25 with successes either
      # side, and manual `workflow_dispatch` re-runs that passed without changing anything. Those
      # re-runs are also why the PR kept DISPLAYING red long after: a `workflow_dispatch` success
      # does not replace the `pull_request` check on the PR, so the last failing PR-event run stayed
      # on the rollup.
      # Distinct from the register-C5 flakes, which are socket-level `Parse Error` symptoms with a
      # different cause; this one is pool starvation and is fully explained by the pool size.
      DATABASE_URL: postgresql://svyft:svyft@localhost:5432/svyft?schema=public&connection_limit=10
      DIRECT_URL: postgresql://svyft:svyft@localhost:5432/svyft?schema=public
      JWT_ACCESS_SECRET: test-access-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @svyft/shared build
      - run: pnpm exec prisma generate --schema prisma/schema.prisma --allow-no-models
      - run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
