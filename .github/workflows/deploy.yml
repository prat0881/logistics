name: Deploy
on:
  push:
    branches: [main]
    paths: # only redeploy when runtime code/deps change — not docs/config
      - "apps/**"
      - "packages/**"
      - "prisma/**"
      - "pnpm-lock.yaml"
  workflow_dispatch: {} # manual "Run workflow" for redeploys / config-only changes
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/svyft-logistics
            export IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm -e IMAGE="$IMAGE" api pnpm exec prisma migrate deploy --schema prisma/schema.prisma
            docker compose -f docker-compose.prod.yml up -d
